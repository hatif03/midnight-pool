<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Midnight Pool">
  <title>Midnight Pool</title>
  <!-- Arcade mark: glossy 8-ball on felt, gold pocket rim, Lilita-like M.
       Colours match tokens.css and scene.js. The M is a path so PWA
       rasterization does not need the display face. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#46b0f2"/>
      <stop offset="40%" stop-color="#1f7fd0"/>
      <stop offset="100%" stop-color="#114f88"/>
    </radialGradient>
    <radialGradient id="sphere" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="22%" stop-color="#2c2c2c"/>
      <stop offset="62%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- Contact shadow. Ellipse, not a filter: sharp is unreliable with feDropShadow. -->
  <ellipse cx="256" cy="430" rx="148" ry="26" fill="#000" opacity=".28"/>

  <!-- Pocket rim: 3D edge then gold face. Inner lip is a 2px stroke so it
       does not read as a third ring. -->
  <circle cx="256" cy="256" r="176" fill="#a9610a"/>
  <circle cx="256" cy="256" r="170" fill="#f5a623"/>
  <circle cx="256" cy="256" r="158" fill="url(#sphere)"/>
  <circle cx="256" cy="256" r="158" fill="url(#shade)"/>
  <circle cx="256" cy="256" r="159" fill="none" stroke="#ffe9a3" stroke-width="2.5" opacity=".85"/>

  <!-- Specular sits on the black, outside the number circle. -->
  <ellipse cx="178" cy="178" rx="44" ry="32" fill="#fff" opacity=".42"/>
  <circle cx="168" cy="168" r="14" fill="#fff" opacity=".75"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/>

  <circle cx="256" cy="256" r="76" fill="#fbf7ec"/>

  <!-- Chunky M, round terminals, valley above the baseline. -->
  <path fill="#3a1e07" d="
    M 216 228
    Q 216 218 226 218
    L 238 218
    Q 247 218 250 228
    L 256 252
    L 262 228
    Q 265 218 274 218
    L 286 218
    Q 296 218 296 228
    L 296 294
    Q 296 304 286 304
    L 274 304
    Q 264 304 264 294
    L 264 268
    L 256 284
    L 248 268
    L 248 294
    Q 248 304 238 304
    L 226 304
    Q 216 304 216 294
    Z"/>
</svg>
